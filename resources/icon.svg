<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle inner border -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- Crescent & Star accent -->
  <path d="M 360 140 A 45 45 0 1 1 310 95 A 36 36 0 1 0 360 140 Z" fill="url(#goldGrad)" opacity="0.85" />

  <!-- Arabic Calligraphy letter Waw (و) -->
  <g fill="#ffffff" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.15))">
    <path d="M 280 180 C 255 180 230 195 218 218 C 206 242 208 270 224 290 C 238 308 260 318 284 316 C 308 314 328 300 338 278 C 348 256 344 228 330 208 C 318 190 300 180 280 180 Z M 280 216 C 292 216 302 225 306 238 C 310 251 306 265 298 274 C 290 283 278 286 268 282 C 258 278 252 268 252 256 C 252 234 264 216 280 216 Z" />
    <!-- Tail of the Waw curving downwards gracefully -->
    <path d="M 252 305 C 230 330 200 360 160 380 C 145 388 128 392 110 395 C 105 396 100 392 102 386 C 112 360 140 335 175 315 C 200 300 228 290 252 285 Z" />
  </g>

  <!-- Open Quran / Book motif at base -->
  <path d="M 180 410 C 220 395 245 405 256 415 C 267 405 292 395 332 410 C 336 412 338 416 336 420 C 334 424 330 425 326 423 C 290 410 270 418 256 428 C 242 418 222 410 186 423 C 182 425 178 424 176 420 C 174 416 176 412 180 410 Z" fill="url(#goldGrad)" opacity="0.9" />
</svg>
