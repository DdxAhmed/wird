name: CI - Lint, Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild & download electron binary
        run: node ./node_modules/electron/install.js

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Unit Tests
        run: pnpm test

      - name: Build Application
        run: pnpm run build

